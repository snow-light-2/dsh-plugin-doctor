# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# []
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  disabled: false
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
    reasoningEffort: high
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    baseURL: https://api.deepseek.com/anthropic
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        description: Fast, efficient, and economical; suited to focused, routine, or
          parallel tasks.
        contextWindow: 1000000
        inputModalities:
          - text
          - image
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
          - image
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: dsh-boot-animation
  disabled: true
- id: better-sidebar
  disabled: true

# 让宿主自带侧栏回来：codex-ui 的 bundle patch 关掉了 ui-sidebar，而 codex-ui 本身已被市场停用。
- id: ui-sidebar
  disabled: false

# 同属 codex-ui bundle patch 关掉的三条，一并恢复（profile 是最后生效层）
- id: session-title-llm
  disabled: false

# ── codex-ui 必须整套关闭 ──
# 它的 dsh.bundle.patch 会关掉宿主的 ui-sidebar / ui-settings-general / session-title-llm，
# 并用自己的一套来顶替。所以「宿主 UI 全开」和「codex-ui 条目开启」不能同时成立 ——
# 上一次启动就是因为它的 session-title provider 与宿主的撞了单例而整树崩溃。
- id: michengai-codex-ui-session-title
  disabled: true
- id: codex-ui
  disabled: true